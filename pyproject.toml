[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "Local-first log intelligence: parse, cluster, and visualize logs with zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "遥か" }]
keywords = ["logs", "analysis", "clustering", "devops", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
]

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.setuptools.package-data]
loglens = ["web/*"]
